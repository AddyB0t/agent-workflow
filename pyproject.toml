[project]
name = "agent-workflow"
version = "0.1.0"
description = "Multi-agent bug-fixing workflow: LangGraph agents, MCP tools, E2B sandbox, human approval, Postgres memory, OpenTelemetry."
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-mcp-adapters>=0.1",
    "langchain-openai>=0.3",
    "mcp>=1.6",
    "e2b-code-interpreter>=1.0",
    "playwright>=1.49",
    "psycopg[binary,pool]>=3.2",
    "pgserver>=0.1.4",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "tavily-python>=0.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-dotenv>=1.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
