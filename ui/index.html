<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agent Workflow</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; background: #f4f6fa; color: #1c2330; }
  header { background: #1f2a44; color: #fff; padding: 12px 24px; display: flex; gap: 12px; align-items: center; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px 24px; }
  .card { background: #fff; border: 1px solid #dde3ee; border-radius: 10px; padding: 12px 16px; }
  .run { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; font-size: 13px; }
  .run:hover, .run.sel { background: #eef2fb; }
  .st { font-size: 11px; padding: 1px 6px; border-radius: 8px; background: #e5e8ef; }
  .passed { background: #d6f5df; } .failed, .error, .rejected { background: #fadcdc; }
  .stopped { background: #ffe9c2; } .awaiting_approval { background: #ffe58a; } .running { background: #dbe6ff; }
  .step { border-left: 3px solid #2f6fed; padding: 4px 10px; margin: 6px 0; font-size: 13px; }
  .step b { display: inline-block; min-width: 120px; }
  pre { background: #f7f8fb; padding: 10px; border-radius: 6px; white-space: pre-wrap; font-size: 12px; }
  .approval { border: 2px solid #e6b54a; background: #fffaf0; }
  button { padding: 6px 14px; border-radius: 6px; border: 0; cursor: pointer; }
  .ok { background: #1f9d55; color: #fff; } .no { background: #d64545; color: #fff; }
  select, header button { padding: 6px; border-radius: 6px; }
  .meta { color: #667; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Multi-Agent Bug Fixer</h1>
  <select id="task"></select>
  <button onclick="startRun()">Start run</button>
</header>
<main>
  <section class="card"><h3>Runs</h3><div id="runs"></div></section>
  <section class="card" id="detail"><p class="meta">Pick or start a run.</p></section>
</main>
<script>
let current = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function init() {
  const tasks = await api("/api/tasks");
  $("task").innerHTML = tasks.map((t) => `<option>${t}</option>`).join("");
  refresh();
  setInterval(refresh, 2000);
}

async function startRun() {
  const { run_id } = await api("/api/runs", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ task: $("task").value }),
  });
  current = run_id;
  refresh();
}

async function decide(approved) {
  await api(`/api/runs/${current}/decision`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ approved }),
  });
  refresh();
}

function summary(node, d) {
  if (node === "planner") return (d.plan || []).map((s, i) => `${i + 1}. ${esc(s)}`).join("<br>");
  if (node === "researcher") return `${(d.tool_calls || []).length} tool calls: ${esc((d.tool_calls || []).join(", "))}<pre>${esc(d.findings)}</pre>`;
  if (node === "coder") return `attempt ${d.attempts}: ${esc(d.explanation)}`;
  if (node === "tester") return `${d.tests_passed ? "✅ tests passed" : "❌ tests failed"}<pre>${esc(d.test_output)}</pre>`;
  if (node === "reviewer") return `${d.review?.approve ? "approve" : "request changes"}: ${esc(d.review?.comments)}`;
  if (node === "human_approval") return d.approved ? "approved" : "rejected";
  if (node === "finish") return `status: ${esc(d.status)}`;
  return esc(JSON.stringify(d)).slice(0, 300);
}

async function refresh() {
  const runs = await api("/api/runs");
  $("runs").innerHTML = runs.map((r) =>
    `<div class="run ${r.run_id === current ? "sel" : ""}" onclick="current='${r.run_id}';refresh()">
       <span>${r.run_id}</span><span class="st ${r.status}">${r.status}</span></div>`).join("");
  if (!current) return;
  const d = await api(`/api/runs/${current}`);
  const r = d.run;
  let html = `<h3>${esc(r.run_id)} <span class="st ${r.status}">${r.status}</span></h3>
    <p class="meta">steps ${r.steps ?? 0} · tokens ${r.tokens ?? 0} · cost $${(r.cost_usd ?? 0).toFixed(4)}
    ${r.guardrail ? ` · guardrail: ${esc(r.guardrail)}` : ""}</p>`;
  if (d.error) html += `<pre>${esc(d.error)}</pre>`;
  if (d.approval) {
    html += `<div class="card approval"><b>Approval needed:</b> ${esc(d.approval.action)}
      <pre>${esc(d.approval.diff)}</pre><p>Coder: ${esc(d.approval.explanation)}</p>
      <p>Reviewer: ${esc(d.approval.reviewer)}</p>
      <button class="ok" onclick="decide(true)">Approve</button> <button class="no" onclick="decide(false)">Reject</button></div>`;
  }
  html += d.steps.map((s) => `<div class="step"><b>${s.n}. ${s.node}</b> ${summary(s.node, s.detail)}</div>`).join("");
  $("detail").innerHTML = html;
}
init();
</script>
</body>
</html>
